<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Smart Haven – Mobile Smart Home</title>
<style>
  :root{
    --bg-primary: #0a0e1a;
    --bg-secondary: #12172b;
    --bg-card: #1a2035;
    --bg-elevated: #212842;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-light: #60a5fa;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --border: rgba(255,255,255,0.06);
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -1px rgba(0,0,0,0.2);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -2px rgba(0,0,0,0.3);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1420 100%);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 24px;
  }
  
  /* Header */
  header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  
  .header-content {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .logo {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }
  
  .brand-text h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  
  .brand-text .subtitle {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .mode-selector {
    display: flex;
    gap: 6px;
    background: var(--bg-primary);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  
  .mode-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  
  .mode-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
  }
  
  /* Main Container */
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }
  
  /* Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  
  .tabs::-webkit-scrollbar { display: none; }
  
  .tab {
    padding: 10px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  
  .tab.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  
  .tab-content {
    display: none;
  }
  
  .tab-content.active {
    display: block;
  }
  
  /* Rooms Grid */
  .rooms-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr;
  }
  
  @media (min-width: 768px) {
    .rooms-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  
  @media (min-width: 1200px) {
    .rooms-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
  
  /* Room Card */
  .room-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  .room-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  
  .room-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  
  .room-title {
    font-size: 18px;
    font-weight: 700;
  }
  
  .device-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-elevated);
    padding: 4px 10px;
    border-radius: 12px;
  }
  
  /* Device Item */
  .device {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all 0.2s;
  }
  
  .device:last-child {
    margin-bottom: 0;
  }
  
  .device-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  
  .device-icon {
    width: 44px;
    height: 44px;
    background: var(--bg-card);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  
  .device-info {
    flex: 1;
    min-width: 0;
  }
  
  .device-name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 2px;
  }
  
  .device-status {
    font-size: 13px;
    color: var(--text-muted);
  }
  
  .device-status.active {
    color: var(--success);
  }
  
  .device-status.warning {
    color: var(--warning);
  }
  
  .device-status.danger {
    color: var(--danger);
  }
  
  /* Device Controls */
  .device-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  
  .control-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-primary);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  
  .control-btn:active {
    transform: scale(0.96);
  }
  
  .control-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  
  .control-btn.success {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  
  .control-btn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
  }
  
  .control-slider {
    flex: 1;
    min-width: 120px;
    height: 36px;
    display: flex;
    align-items: center;
  }
  
  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: linear-gradient(90deg, var(--accent), #8b5cf6);
    border-radius: 6px;
    outline: none;
  }
  
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  
  input[type="color"] {
    width: 44px;
    height: 36px;
    border: 2px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
  }
  
  /* Quick Actions */
  .quick-actions {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
  }
  
  .action-btn {
    padding: 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  
  .action-btn:active {
    transform: scale(0.96);
  }
  
  .action-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  
  /* Rule Builder */
  .rule-builder {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  
  .form-group {
    margin-bottom: 16px;
  }
  
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  
  select, input[type="text"] {
    width: 100%;
    padding: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  
  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }
  
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  
  .form-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }
  
  /* Rules List */
  .rules-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  
  .rule-item {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
  }
  
  .rule-content {
    flex: 1;
    min-width: 0;
  }
  
  .rule-name {
    font-weight: 600;
    margin-bottom: 4px;
  }
  
  .rule-details {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .rule-remove {
    padding: 6px 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--danger);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  
  /* Activity Log */
  .activity-log {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  
  .log-container {
    max-height: 300px;
    overflow-y: auto;
    background: var(--bg-elevated);
    border-radius: 10px;
    padding: 12px;
  }
  
  .log-entry {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
  }
  
  .log-entry:last-child {
    border-bottom: none;
  }
  
  .log-entry.success {
    color: var(--success);
  }
  
  .log-entry.warning {
    color: var(--warning);
  }
  
  .log-entry.danger {
    color: var(--danger);
  }
  
  .log-time {
    color: var(--text-muted);
    margin-right: 8px;
  }
  
  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  
  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  
  /* Footer */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 13px;
  }
  
  /* Responsive */
  @media (max-width: 480px) {
    .container {
      padding: 16px;
    }
    
    .brand-text h1 {
      font-size: 18px;
    }
    
    .mode-btn {
      padding: 8px 12px;
      font-size: 12px;
    }
    
    .form-row {
      grid-template-columns: 1fr;
    }
    
    .actions-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand">
      <div class="logo">SH</div>
      <div class="brand-text">
        <h1>Smart Haven</h1>
        <div class="subtitle">Your Connected Home</div>
      </div>
    </div>
    <div class="mode-selector">
      <button class="mode-btn" id="modeMorning">☀️ Morning</button>
      <button class="mode-btn" id="modeNight">🌙 Night</button>
      <button class="mode-btn" id="modeAway">🔒 Away</button>
    </div>
  </div>
</header>

<div class="container">
  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="rooms">🏠 Rooms</div>
    <div class="tab" data-tab="automations">⚙️ Automations</div>
    <div class="tab" data-tab="activity">📊 Activity</div>
  </div>
  
  <!-- Rooms Tab -->
  <div class="tab-content active" data-content="rooms">
    <div class="quick-actions">
      <div class="section-title">⚡ Quick Actions</div>
      <div class="actions-grid">
        <button class="action-btn primary" id="btnSimAllMotion">Simulate All Motion</button>
        <button class="action-btn" id="btnSimSmoke">Test Smoke Alarm</button>
        <button class="action-btn" id="btnClearLog">Clear Activity Log</button>
      </div>
    </div>
    
    <div class="rooms-grid" id="roomsContainer"></div>
  </div>
  
  <!-- Automations Tab -->
  <div class="tab-content" data-content="automations">
    <div class="rule-builder">
      <div class="section-title">➕ Create New Rule</div>
      
      <div class="form-group">
        <label class="form-label">WHEN (Trigger)</label>
        <div class="form-row">
          <select id="rb_trigger_device"></select>
          <select id="rb_trigger_event">
            <option value="motion_detected">Motion Detected</option>
            <option value="no_motion_5m">No Motion (5m)</option>
            <option value="smoke_detected">Smoke Detected</option>
            <option value="time_event">Time Event</option>
          </select>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">IF (Condition - Optional)</label>
        <select id="rb_condition">
          <option value="">No Condition</option>
          <option value="time.isNight">Is Night Time</option>
          <option value="time.isMorning">Is Morning</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">THEN (Action)</label>
        <div class="form-row">
          <select id="rb_action_device"></select>
          <select id="rb_action_type">
            <option value="set_state">Set State</option>
            <option value="set_brightness">Set Brightness</option>
            <option value="set_color">Set Color</option>
            <option value="set_volume">Set Volume</option>
          </select>
        </div>
        <input type="text" id="rb_action_value" placeholder='Value: {"state":"on"} or 60' style="margin-top: 10px;" />
        <div class="form-hint">Example for set_state: {"state":"on"} | For brightness: 80</div>
      </div>
      
      <div style="display: flex; gap: 10px;">
        <button class="control-btn primary" id="rb_add" style="flex: 1;">Add Rule</button>
        <button class="control-btn success" id="rb_save">💾 Save All</button>
      </div>
    </div>
    
    <div class="rule-builder">
      <div class="section-title">📋 Active Rules</div>
      <div class="rules-list" id="rulesList"></div>
    </div>
  </div>
  
  <!-- Activity Tab -->
  <div class="tab-content" data-content="activity">
    <div class="activity-log">
      <div class="section-title">📝 Activity Log</div>
      <div class="log-container" id="log"></div>
    </div>
  </div>
</div>

<footer>
  Smart Haven © 2025 • Mobile Smart Home Simulator
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // ---------- Utilities ----------
  function saveData(key, obj){ try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e){ console.error(e); } }
  function loadData(key){ try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch(e){ console.error(e); return null; } }
  function uid(prefix="id"){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

  // ---------- Default home ----------
  const DEFAULT_HOME = {
    home: {
      name: "Smart Haven",
      rooms: [
        { name:"Living Room", devices:[
            { id:"light_livingroom", type:"light", label:"Living Light", state:"off", brightness:0, color:"#ffd6a5" },
            { id:"music_livingroom", type:"music_player", label:"Living Music", state:"paused", volume:40 },
            { id:"motion_livingroom", type:"motion_sensor", label:"Living Motion", state:"idle" },
            { id:"temperature_livingroom", type:"temperature_sensor", label:"Living Temp", value:22 }
        ]},
        { name:"Kitchen", devices:[
            { id:"coffee_maker", type:"appliance", label:"Coffee Maker", state:"off" },
            { id:"smoke_sensor", type:"smoke_detector", label:"Smoke Sensor", state:"clear" },
            { id:"smart_plug_kitchen", type:"smart_plug", label:"Kitchen Plug", state:"off" },
            { id:"fridge_monitor", type:"door_sensor", label:"Fridge Door", state:"closed" }
        ]},
        { name:"Bedroom", devices:[
            { id:"lamp_bedroom", type:"light", label:"Bed Lamp", state:"off", brightness:0, color:"#fff1f2" },
            { id:"blinds_bedroom", type:"blinds", label:"Blinds", state:"closed" },
            { id:"thermostat_bedroom", type:"thermostat", label:"Thermostat", value:19 },
            { id:"music_bedroom", type:"music_player", label:"Bedroom Music", state:"paused", volume:30 }
        ]}
      ]
    },
    automations: [
      { id:"auto_1", name:"Living Motion Lights", trigger:{device:"motion_livingroom", event:"motion_detected"}, cond:"", actions:[{device:"light_livingroom", set:{state:"on", brightness:80}}, {device:"music_livingroom", set:{state:"playing"}}] },
      { id:"auto_4", name:"Smoke Alert", trigger:{device:"smoke_sensor", event:"smoke_detected"}, cond:"", actions:[{device:"music_livingroom", set:{state:"paused"}},{device:"light_livingroom", set:{state:"on", brightness:100}},{alert:"🚨 Smoke detected! Evacuate immediately!" }] }
    ]
  };

  // ---------- State ----------
  let smartHome = loadData("smart_home_v2") || DEFAULT_HOME;
  let userRules = loadData("smart_rules_v2") || smartHome.automations.slice();

  // ---------- Element refs ----------
  const roomsContainer = document.getElementById("roomsContainer");
  const logDiv = document.getElementById("log");
  const rbTriggerDevice = document.getElementById("rb_trigger_device");
  const rbTriggerEvent = document.getElementById("rb_trigger_event");
  const rbCondition = document.getElementById("rb_condition");
  const rbActionDevice = document.getElementById("rb_action_device");
  const rbActionType = document.getElementById("rb_action_type");
  const rbActionValue = document.getElementById("rb_action_value");
  const rulesList = document.getElementById("rulesList");

  // ---------- Helpers ----------
  function findDeviceById(id){
    for(const r of smartHome.home.rooms){
      const dev = r.devices.find(d=>d.id===id);
      if(dev) return dev;
    }
    return null;
  }

  // ---------- Tab System ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const targetTab = tab.getAttribute('data-tab');
      
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      tab.classList.add('active');
      document.querySelector(`[data-content="${targetTab}"]`).classList.add('active');
    });
  });

  // ---------- Logging ----------
  function log(msg, level="info"){
    const time = new Date().toLocaleTimeString();
    const div = document.createElement("div");
    div.className = `log-entry ${level}`;
    div.innerHTML = `<span class="log-time">${time}</span>${msg}`;
    logDiv.prepend(div);
  }
  
  function clearLogs(){ 
    logDiv.innerHTML=""; 
    log("Activity log cleared","info"); 
  }

  // ---------- Device Icons ----------
  function deviceIcon(type){
    switch(type){
      case "light": return "💡";
      case "music_player": return "🎵";
      case "motion_sensor": return "👣";
      case "smoke_detector": return "🔥";
      case "appliance": return "☕";
      case "smart_plug": return "🔌";
      case "door_sensor": return "🚪";
      case "thermostat": return "🌡️";
      case "temperature_sensor": return "🌡️";
      case "blinds": return "🪟";
      default: return "🔘";
    }
  }

  // ---------- Render Rooms ----------
  function renderRooms(){
    try {
      roomsContainer.innerHTML = "";
      
      for(const room of smartHome.home.rooms){
        const roomCard = document.createElement("div");
        roomCard.className = "room-card";
        
        roomCard.innerHTML = `
          <div class="room-header">
            <div class="room-title">${room.name}</div>
            <div class="device-count">${room.devices.length} devices</div>
          </div>
        `;
        
        room.devices.forEach(device => {
          const deviceDiv = document.createElement("div");
          deviceDiv.className = "device";
          
          let statusText = "";
          let statusClass = "";
          
          if(device.type === "light"){
            statusText = device.state === "on" ? `On • ${device.brightness}%` : "Off";
            statusClass = device.state === "on" ? "active" : "";
          } else if(device.type === "music_player"){
            statusText = device.state === "playing" ? `Playing • Vol ${device.volume}%` : "Paused";
            statusClass = device.state === "playing" ? "active" : "";
          } else if(device.type === "motion_sensor"){
            statusText = device.state === "active" ? "Motion Detected" : "No Motion";
            statusClass = device.state === "active" ? "warning" : "";
          } else if(device.type === "smoke_detector"){
            statusText = device.state === "smoke" ? "🚨 SMOKE DETECTED!" : "Clear";
            statusClass = device.state === "smoke" ? "danger" : "active";
          } else if(device.type === "temperature_sensor" || device.type === "thermostat"){
            statusText = `${device.value}°C`;
          } else {
            statusText = device.state || "Unknown";
            statusClass = (device.state === "on" || device.state === "open") ? "active" : "";
          }
          
          deviceDiv.innerHTML = `
            <div class="device-header">
              <div class="device-icon">${deviceIcon(device.type)}</div>
              <div class="device-info">
                <div class="device-name">${device.label || device.id}</div>
                <div class="device-status ${statusClass}">${statusText}</div>
              </div>
            </div>
            <div class="device-controls" id="controls_${device.id}"></div>
          `;
          
          roomCard.appendChild(deviceDiv);
        });
        
        roomsContainer.appendChild(roomCard);
      }
      
      // Attach controls
      for(const room of smartHome.home.rooms){
        for(const d of room.devices){
          const controls = document.getElementById(`controls_${d.id}`);
          if(!controls) continue;
          controls.innerHTML = "";
          
          // LIGHT
          if(d.type==="light"){
            const colorWrap = document.createElement("div");
            const color = document.createElement("input");
            color.type="color";
            color.value = d.color || "#ffd6a5";
            color.oninput = ()=>{ 
              d.color = color.value; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`💡 ${d.label} color changed`); 
            };
            colorWrap.appendChild(color);
            
            const sliderWrap = document.createElement("div");
            sliderWrap.className = "control-slider";
            const bright = document.createElement("input");
            bright.type="range";
            bright.min=0;
            bright.max=100;
            bright.value = d.brightness || 0;
            bright.oninput = ()=>{ 
              d.brightness = Number(bright.value); 
              d.state = d.brightness>0 ? "on" : "off"; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`💡 ${d.label} brightness ${d.brightness}%`); 
            };
            sliderWrap.appendChild(bright);
            
            const toggle = document.createElement("button");
            toggle.className = d.state==="on" ? "control-btn success" : "control-btn";
            toggle.textContent = d.state==="on" ? "On" : "Off";
            toggle.onclick = ()=>{ 
              d.state = d.state==="on" ? "off" : "on"; 
              if(d.state==="on" && d.brightness===0) d.brightness=80; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`💡 ${d.label} toggled ${d.state}`); 
            };
            
            controls.appendChild(colorWrap);
            controls.appendChild(sliderWrap);
            controls.appendChild(toggle);
          }
          // MUSIC
          else if(d.type==="music_player"){
            const sliderWrap = document.createElement("div");
            sliderWrap.className = "control-slider";
            const vol = document.createElement("input");
            vol.type="range";
            vol.min=0;
            vol.max=100;
            vol.value = d.volume || 40;
            vol.oninput = ()=>{ 
              d.volume = Number(vol.value); 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`🔊 ${d.label} volume ${d.volume}%`); 
            };
            sliderWrap.appendChild(vol);
            
            const play = document.createElement("button");
            play.className = d.state==="playing" ? "control-btn success" : "control-btn";
            play.textContent = d.state==="playing" ? "⏸ Pause" : "▶️ Play";
            play.onclick = ()=>{ 
              d.state = d.state==="playing" ? "paused" : "playing"; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`🎵 ${d.label} ${d.state}`); 
            };
            
            controls.appendChild(sliderWrap);
            controls.appendChild(play);
          }
          // MOTION
          else if(d.type==="motion_sensor"){
            const btn = document.createElement("button");
            btn.className="control-btn primary";
            btn.textContent="Test Motion";
            btn.onclick = ()=>{ 
              d.state="active"; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              simulateEvent(d.id,"motion_detected"); 
              setTimeout(()=>{ 
                d.state="idle"; 
                saveData("smart_home_v2", smartHome); 
                renderRooms(); 
                simulateEvent(d.id,"no_motion_5m"); 
              },5000); 
              log(`👣 Motion simulated at ${d.label}`, "warning"); 
            };
            controls.appendChild(btn);
          }
          // SMOKE
          else if(d.type==="smoke_detector"){
            const btn = document.createElement("button");
            btn.className="control-btn danger";
            btn.textContent="🚨 Test Alarm";
            btn.onclick = ()=>{ 
              d.state="smoke"; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              simulateEvent(d.id,"smoke_detected"); 
              setTimeout(()=>{ 
                d.state="clear"; 
                saveData("smart_home_v2", smartHome); 
                renderRooms(); 
              },8000); 
              log(`🔥 Smoke alarm triggered at ${d.label}`, "danger"); 
            };
            controls.appendChild(btn);
          }
          // APPLIANCE/PLUG/BLINDS
          else if(["appliance","smart_plug","blinds"].includes(d.type)){
            const btn = document.createElement("button");
            const isOn = (d.state==="on"||d.state==="open");
            btn.className = isOn ? "control-btn success" : "control-btn";
            btn.textContent = isOn ? "Turn Off" : "Turn On";
            btn.onclick = ()=>{ 
              d.state = isOn ? (d.type==="blinds" ? "closed" : "off") : (d.type==="blinds" ? "open" : "on"); 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`${deviceIcon(d.type)} ${d.label} ${d.state}`); 
            };
            controls.appendChild(btn);
          }
          // THERMOSTAT/TEMP
          else if(["thermostat","temperature_sensor"].includes(d.type)){
            const btnDown = document.createElement("button");
            btnDown.className="control-btn";
            btnDown.textContent="❄️ -";
            btnDown.onclick = ()=>{ 
              if(d.value > 16) d.value--; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`🌡️ ${d.label} set to ${d.value}°C`); 
            };
            
            const btnUp = document.createElement("button");
            btnUp.className="control-btn";
            btnUp.textContent="🔥 +";
            btnUp.onclick = ()=>{ 
              if(d.value < 30) d.value++; 
              saveData("smart_home_v2", smartHome); 
              renderRooms(); 
              log(`🌡️ ${d.label} set to ${d.value}°C`); 
            };
            
            controls.appendChild(btnDown);
            controls.appendChild(btnUp);
          }
        }
      }

      populateRuleBuilder();
    } catch(e){ 
      console.error("renderRooms error:", e); 
      log("⚠️ Error rendering rooms: " + e.message, "danger"); 
    }
  }

  // ---------- Rule builder population ----------
  function populateRuleBuilder(){
    try {
      rbTriggerDevice.innerHTML = "";
      rbActionDevice.innerHTML = "";
      const devs = [];
      for(const r of smartHome.home.rooms) 
        for(const d of r.devices) 
          devs.push({id:d.id, label:d.label||d.id, type:d.type});
      
      devs.forEach(d=>{
        const o1 = document.createElement("option");
        o1.value=d.id;
        o1.textContent=d.label;
        rbTriggerDevice.appendChild(o1);
        
        const o2 = document.createElement("option");
        o2.value=d.id;
        o2.textContent=d.label;
        rbActionDevice.appendChild(o2);
      });
    } catch(e){ 
      console.error("populateRuleBuilder error:", e); 
    }
  }

  // ---------- Automation engine ----------
  function applyActionObj(action){
    if(action.device){
      const device = findDeviceById(action.device);
      if(!device){ 
        log("⚠️ Action target not found: " + action.device, "warning"); 
        return; 
      }
      if(action.set){ 
        Object.assign(device, action.set); 
        saveData("smart_home_v2", smartHome); 
        renderRooms(); 
        log(`🔧 ${device.label||device.id} updated`, "success"); 
      }
    } else if(action.alert){
      log(action.alert, "danger");
    }
  }

  function simulateEvent(deviceId, eventType){
    log(`🎯 Event: ${eventType} from ${deviceId}`);
    for(const rule of userRules){
      const trig = rule.trigger || {};
      const cond = rule.cond || "";
      let trigMatches = false;
      
      if(trig.device === deviceId && trig.event === eventType) trigMatches = true;
      if(trig.event === "time_event" && eventType === "time_event" && trig.time && rule.time) 
        trigMatches = (trig.time === rule.time);

      if(trigMatches){
        let condOk = true;
        if(cond === "time.isNight") condOk = isNight();
        if(cond === "time.isMorning") condOk = isMorning();
        
        if(condOk){
          log(`⚙️ Rule triggered: ${rule.name}`, "success");
          for(const a of rule.actions) applyActionObj(a);
        } else {
          log(`Rule ${rule.name} skipped (condition not met)`);
        }
      }
    }
  }

  // ---------- Rule builder handlers ----------
  document.getElementById("rb_add").addEventListener("click", ()=>{
    try {
      const triggerDevice = rbTriggerDevice.value;
      const triggerEvent = rbTriggerEvent.value;
      const condition = rbCondition.value || "";
      const actionDevice = rbActionDevice.value;
      const actionType = rbActionType.value;
      const actionValueRaw = rbActionValue.value.trim();
      
      if(!triggerDevice || !triggerEvent || !actionDevice || !actionType || !actionValueRaw){ 
        alert("Please fill in all fields"); 
        return; 
      }

      let parsed;
      try { 
        parsed = JSON.parse(actionValueRaw); 
      } catch(e){ 
        parsed = (!isNaN(Number(actionValueRaw)) ? Number(actionValueRaw) : actionValueRaw); 
      }

      const actionObj = {};
      if(actionType === "set_state"){ 
        actionObj.device = actionDevice; 
        actionObj.set = parsed; 
      }
      else if(actionType === "set_brightness"){ 
        actionObj.device = actionDevice; 
        actionObj.set = { brightness: Number(parsed), state: Number(parsed) > 0 ? "on" : "off" }; 
      }
      else if(actionType === "set_color"){ 
        actionObj.device = actionDevice; 
        actionObj.set = { color: parsed }; 
      }
      else if(actionType === "set_volume"){ 
        actionObj.device = actionDevice; 
        actionObj.set = { volume: Number(parsed) }; 
      }

      const newRule = { 
        id: uid("rule"), 
        name: `Rule ${userRules.length+1}`, 
        trigger: { device: triggerDevice, event: triggerEvent }, 
        cond: condition, 
        actions: [actionObj] 
      };
      
      userRules.push(newRule);
      saveData("smart_rules_v2", userRules);
      renderRules();
      log(`➕ Created rule: ${newRule.name}`, "success");
      rbActionValue.value = "";
    } catch(e){ 
      console.error("rb_add error:", e); 
      alert("Error creating rule: "+e.message); 
    }
  });

  document.getElementById("rb_save").addEventListener("click", ()=>{ 
    saveData("smart_rules_v2", userRules); 
    log("💾 Rules saved to storage", "success"); 
  });

  function renderRules(){
    if(userRules.length === 0){
      rulesList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><div>No rules created yet</div></div>';
      return;
    }
    
    rulesList.innerHTML = "";
    userRules.forEach((r,i)=>{
      const div = document.createElement("div");
      div.className = "rule-item";
      
      const content = document.createElement("div");
      content.className = "rule-content";
      content.innerHTML = `
        <div class="rule-name">${r.name}</div>
        <div class="rule-details">
          WHEN ${r.trigger.device} → ${r.trigger.event}
          ${r.cond ? `<br>IF ${r.cond}` : ''}
        </div>
      `;
      
      const rm = document.createElement("button");
      rm.className="rule-remove";
      rm.textContent="Remove";
      rm.onclick = ()=>{ 
        userRules.splice(i,1); 
        saveData("smart_rules_v2", userRules); 
        renderRules(); 
        log(`🗑️ Removed ${r.name}`, "warning"); 
      };
      
      div.appendChild(content);
      div.appendChild(rm);
      rulesList.appendChild(div);
    });
  }

  // ---------- Modes ----------
  let currentMode = "Home";
  
  document.getElementById("modeMorning").addEventListener("click", ()=> runMode("Morning"));
  document.getElementById("modeNight").addEventListener("click", ()=> runMode("Night"));
  document.getElementById("modeAway").addEventListener("click", ()=> runMode("Away"));

  function setModeButtons(m){
    currentMode = m;
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
    if(m==="Morning") document.getElementById("modeMorning").classList.add("active");
    if(m==="Night") document.getElementById("modeNight").classList.add("active");
    if(m==="Away") document.getElementById("modeAway").classList.add("active");
  }

  function runMode(mode){
    setModeButtons(mode);
    log(`⚡ Running ${mode} mode`, "success");
    
    if(mode==="Morning"){
      applyActionObj({device:"lamp_bedroom", set:{state:"on", brightness:70}});
      applyActionObj({device:"blinds_bedroom", set:{state:"open"}});
      applyActionObj({device:"music_bedroom", set:{state:"playing", volume:40}});
      applyActionObj({device:"coffee_maker", set:{state:"on"}});
      log("☀️ Good morning! Starting your day...", "success");
    } else if(mode==="Night"){
      applyActionObj({device:"light_livingroom", set:{state:"on", brightness:20}});
      applyActionObj({device:"lamp_bedroom", set:{state:"off", brightness:0}});
      applyActionObj({device:"music_livingroom", set:{state:"paused"}});
      log("🌙 Night mode activated. Sleep well!", "success");
    } else if(mode==="Away"){
      smartHome.home.rooms.flatMap(r=>r.devices).forEach(d=>{
        if(["light","music_player","appliance","smart_plug"].includes(d.type)){ 
          applyActionObj({device:d.id, set:{state:"off"}}); 
        }
      });
      log("🔒 Away mode: All devices secured", "success");
    }
  }

  // ---------- Quick event buttons ----------
  document.getElementById("btnSimAllMotion").addEventListener("click", ()=> {
    smartHome.home.rooms.forEach(r=>{
      const m = r.devices.find(d=>d.type==="motion_sensor");
      if(m){ 
        m.state="active"; 
        simulateEvent(m.id,"motion_detected"); 
        setTimeout(()=>{ 
          m.state="idle"; 
          simulateEvent(m.id,"no_motion_5m"); 
          saveData("smart_home_v2", smartHome); 
          renderRooms(); 
        },5000); 
      }
    });
    saveData("smart_home_v2", smartHome);
    renderRooms();
    log("👣 Motion simulated in all rooms", "warning");
  });

  document.getElementById("btnSimSmoke").addEventListener("click", ()=> {
    const s = findDeviceById("smoke_sensor");
    if(s){ 
      s.state="smoke"; 
      simulateEvent(s.id,"smoke_detected"); 
      setTimeout(()=>{ 
        s.state="clear"; 
        saveData("smart_home_v2", smartHome); 
        renderRooms(); 
      },8000); 
    }
    saveData("smart_home_v2", smartHome);
    renderRooms();
    log("🔥 Smoke alarm test initiated", "danger");
  });

  document.getElementById("btnClearLog").addEventListener("click", ()=> clearLogs());

  // ---------- Time helpers ----------
  function isNight(){ 
    const h = new Date().getHours(); 
    return (h >= 19 || h < 6); 
  }
  
  function isMorning(){ 
    const h = new Date().getHours(); 
    return (h >= 6 && h < 10); 
  }

  // ---------- Init ----------
  function init(){
    try {
      if(!loadData("smart_home_v2")) saveData("smart_home_v2", smartHome);
      if(!loadData("smart_rules_v2")) saveData("smart_rules_v2", userRules);

      renderRooms();
      renderRules();
      setModeButtons("Home");
      log("🏠 Smart Haven initialized", "success");
      
      // Periodic save
      setInterval(()=>{ 
        saveData("smart_home_v2", smartHome); 
      }, 4000);
    } catch(e){ 
      console.error("init error:", e); 
      log("⚠️ Initialization error: "+e.message, "danger"); 
    }
  }

  init();
});
</script>
</body>
</html>
